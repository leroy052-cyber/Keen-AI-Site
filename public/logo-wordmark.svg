<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <rect width="900" height="200" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFFF00"/>
      <stop offset="100%" stop-color="#00FFB2"/>
    </linearGradient>
    <clipPath id="kClip">
      <text x="20" y="168" font-family="'Space Mono', monospace" font-weight="bold" font-size="180">K</text>
    </clipPath>
  </defs>
  <!-- Gradient K -->
  <g clip-path="url(#kClip)">
    <rect x="20" y="0" width="110" height="200" fill="url(#grad)"/>
  </g>
  <!-- White EEN -->
  <text x="130" y="168" font-family="'Space Mono', monospace" font-weight="bold" font-size="180" fill="#fafafa">EEN</text>
  <!-- Gradient underscore as a drawn rect matching K's gradient -->
  <rect x="462" y="158" width="110" height="16" rx="2" fill="url(#grad)"/>
  <!-- White AI -->
  <text x="572" y="168" font-family="'Space Mono', monospace" font-weight="bold" font-size="180" fill="#fafafa">AI</text>
</svg>
