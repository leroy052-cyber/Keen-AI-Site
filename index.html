    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does Keen AI do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keen AI is an Australian AI consulting firm that helps small businesses, tradies, and agencies find where AI and automation actually fit. We learn your business, identify what's worth fixing, build the solution, and hand you the keys."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Keen AI for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keen AI works with three types of clients: small business owners overwhelmed by admin and manual processes, tradies and service businesses drowning in quoting, invoicing, and scheduling, and agencies or small teams that know AI could help but don't need a full-time hire."
          }
        },
        {
          "@type": "Question",
          "name": "Is Keen AI based in Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Keen AI (keenai.com.au) is an Australian AI consulting business founded by Zak Levy. We are a separate entity from Keen AI Ltd (keen-ai.com), a UK-based company focused on infrastructure and utilities AI."
          }
        },
        {
          "@type": "Question",
          "name": "How does Keen AI's consulting process work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our process has four steps: (1) We learn your business by asking deep questions and understanding how it actually runs. (2) We find what's worth fixing — not everything needs AI. (3) We build the solution — workflows, automations, and integrations that fit your existing operations. (4) We hand you the keys and make sure you understand everything in plain English."
          }
        },
        {
          "@type": "Question",
          "name": "Does every business need AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Sometimes the answer is a better spreadsheet, a simpler process, or just someone telling you your current system is fine. Keen AI gives honest assessments — we won't sell you AI if you don't need it."
          }
        }
      ]
    }
    </script>
