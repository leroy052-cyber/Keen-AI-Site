<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-circle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Primary SEO -->
    <title>Keen AI — AI Consulting for Small Business Australia</title>
    <meta name="description" content="Keen AI — We find where AI fits. AI consulting and automation for small businesses, tradies, and agencies in Australia. Built by a human, for humans." />
    <link rel="canonical" href="https://keenai.com.au/" />

    <!-- Geo targeting — Australia -->
    <meta name="geo.region" content="AU" />
    <meta name="geo.placename" content="Australia" />
    <link rel="alternate" hreflang="en-AU" href="https://keenai.com.au/" />
    <link rel="alternate" hreflang="en" href="https://keenai.com.au/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keen AI" />
    <meta property="og:title" content="Keen AI — AI Consulting for Small Business Australia" />
    <meta property="og:description" content="We find where AI fits. AI consulting and automation for small businesses, tradies, and agencies. No fluff, no jargon — just practical solutions." />
    <meta property="og:url" content="https://keenai.com.au/" />
    <meta property="og:image" content="https://keenai.com.au/logo-keen-ai.png" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keen AI — AI Consulting for Small Business Australia" />
    <meta name="twitter:description" content="We find where AI fits. AI consulting and automation for small businesses, tradies, and agencies. No fluff, no jargon — just practical solutions." />
    <meta name="twitter:image" content="https://keenai.com.au/logo-keen-ai.png" />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Keen AI",
      "url": "https://keenai.com.au",
      "logo": "https://keenai.com.au/logo-keen-ai.png",
      "description": "AI consulting and automation for small businesses, tradies, and agencies in Australia.",
      "email": "zak@keenai.com.au",
      "founder": {
        "@type": "Person",
        "name": "Zak Levy"
      },
      "sameAs": [
        "https://www.linkedin.com/in/zak-levy-63560a200",
        "https://github.com/leroy052-cyber"
      ]
    }
    </script>

    <!-- JSON-LD Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Keen AI",
      "url": "https://keenai.com.au",
      "logo": "https://keenai.com.au/logo-keen-ai.png",
      "description": "We find where AI fits. AI consulting and automation for small businesses, tradies, and agencies in Australia.",
      "email": "zak@keenai.com.au",
      "image": "https://keenai.com.au/logo-keen-ai.png",
      "areaServed": {
        "@type": "Country",
        "name": "Australia"
      },
      "serviceType": ["AI Consulting", "Business Automation", "AI Integration", "Workflow Automation"]
    }
    </script>

    <!-- JSON-LD Structured Data: Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "AI Consulting",
      "provider": {
        "@type": "Organization",
        "name": "Keen AI",
        "url": "https://keenai.com.au"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Australia"
      },
      "description": "AI consulting for small businesses, tradies, and agencies. We learn your business, find what's worth fixing, build the solution, and hand you the keys.",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI Consulting Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Business Discovery & AI Assessment",
              "description": "We learn how your business actually runs and identify where AI and automation can save you time."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Custom AI & Automation Build",
              "description": "We build workflows, automations, and integrations tailored to fit your existing operations."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Training & Handover",
              "description": "We explain everything in plain English and hand you the keys so you can run it independently."
            }
          }
        ]
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&family=TASA+Orbiter:wght@600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
