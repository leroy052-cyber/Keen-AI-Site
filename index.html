    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Keen AI",
      "url": "https://keenai.com.au",
      "description": "An Australian marketplace for AI automation. Small businesses post briefs, builders pick them up, work gets paid on delivery.",
      "inLanguage": "en-AU",
      "publisher": {
        "@type": "Organization",
        "name": "Keen AI"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Keen AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keen AI is a small, Australian-first marketplace connecting small businesses that want AI automations built with the builders who can actually ship them. Businesses post briefs with a budget attached, builders propose a plan and a price, and payment is released when the work is signed off."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Keen AI for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On the demand side: Australian small and medium businesses with a list of things they'd like to automate — chatbots, internal tooling, report generation, integrations, agents, back-office workflows. On the supply side: builders who work with AI automation tools like n8n, Zapier, custom GPTs, agentic frameworks, or bespoke code."
          }
        },
        {
          "@type": "Question",
          "name": "How does payment work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every brief has a budget attached before any builder sees it. Scope and price are agreed before work starts. Payment is held until the business signs off the build, so builders aren't chasing invoices and businesses aren't paying for work that doesn't deliver."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost builders to use Keen AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The first three builds are commission-free for early builders. After that, Keen takes a small percentage of each paid build. There are no monthly subscription fees to list a profile or bid on briefs."
          }
        },
        {
          "@type": "Question",
          "name": "Is Keen AI a live marketplace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keen AI is currently an early experiment. Briefs and builder applications are being collected so we can hand-match the first wave of projects before the platform fully opens. Early participants on both sides get priority access and founding-era terms."
          }
        }
      ]
    }
    </script>
