          "name": "What does Keen AI build for allied health clinics?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keen AI builds custom AI workflows for Australian allied health clinics — documentation assist (AI-drafted SOAP notes), patient recall automation, and intake flows. We integrate with your existing practice management software (Cliniko, Halaxy, Nookal, Power Diary) and hand you the keys when we're done."

        {
          "@type": "Question",
          "name": "Which practice management systems do you integrate with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We integrate with the major Australian practice management systems including Cliniko, Halaxy, Nookal, and Power Diary. Our workflows are built around your existing tools — no rip-and-replace required."
          }
        },
        {
          "@type": "Question",
          "name": "How long does implementation take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "From discovery audit to deployment, a typical engagement takes two to three weeks. We start with a focused audit of your clinic workflows, then build and deploy your custom AI workflows with two weeks of post-launch support."
          }
        },
        {
          "@type": "Question",
          "name": "Do we need to change our existing practice management system?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Keen AI workflows integrate with the practice management software you already use. We build around your existing tools and processes — no switching systems, no retraining your team on a new platform."
          }
        },
        {
          "@type": "Question",
          "name": "What does 'owned by you' mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every workflow we build is handed over to your clinic. There is no ongoing subscription to Keen AI and no vendor lock-in. You own the automations, the documentation, and the integrations. If you never need to call us again, we have done our job."
          }
        }
      ]
    }
    </script>
